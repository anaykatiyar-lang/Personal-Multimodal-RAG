# Personal Advanced RAG Platform Default Configuration
version: "1.0.0"

hardware:
  cpu_only: true
  gpu_execution_approved: false
  cloud_instance_autostart: false
  model_download_autostart: false
  preferred_device: "cpu"

storage:
  sqlite_path: "./data/knowledge_base.db"
  qdrant_path: "./data/qdrant"
  collection_name: "personal_knowledge_base"
  documents_dir: "./data/documents"
  cache_dir: "./cache"

ingestion:
  supported_extensions:
    - ".pdf"
    - ".docx"
    - ".pptx"
    - ".xlsx"
    - ".csv"
    - ".txt"
    - ".md"
    - ".html"
    - ".json"
    - ".py"
    - ".png"
    - ".jpg"
    - ".jpeg"
  max_file_size_mb: 100
  enable_ocr: false
  enable_vision_extraction: false

chunking:
  strategy: "parent_child"
  child_chunk_size: 500
  child_chunk_overlap: 100
  parent_chunk_size: 1600
  preserve_tables: true
  preserve_code_blocks: true

embeddings:
  provider: "sentence_transformers"
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  batch_size: 32
  normalize: true

retrieval:
  top_k: 10
  dense_weight: 0.65
  lexical_weight: 0.35
  rrf_k: 60
  enable_mmr: false
  mmr_diversity: 0.3
  enable_parent_retrieval: true
  abstain_threshold: 0.25

reranking:
  enabled: false
  model_name: "BAAI/bge-reranker-small"
  top_n: 5

generation:
  provider: "mock"
  model_name: "mock-model"
  temperature: 0.0
  max_tokens: 512
  strict_grounding: true

citation:
  verify_citations: true
  strict_necessity_filter: true
  allow_partial_citations: false

