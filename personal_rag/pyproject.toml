[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-rag"
version = "0.1.0"
description = "A modular, production-minded personal multimodal knowledge and research assistant platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Personal RAG Architect", email = "architect@example.local"}
]
keywords = [
    "rag", "multimodal", "retrieval", "search", "bm25",
    "vector-search", "knowledge-base", "qwen", "research-assistant"
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "sqlite-vec>=0.1.1; platform_system != 'Windows'",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
documents = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "pillow>=10.2.0",
]
search = [
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.8.0",
]
embeddings = [
    "sentence-transformers>=2.5.0",
]
llm = [
    "transformers>=4.45.0",
    "accelerate>=0.28.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]
ui = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
]
all = [
    "personal-rag[dev,documents,search,embeddings,llm,ui]",
]

[project.scripts]
personal-rag = "personal_rag.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast deterministic unit tests running on CPU",
    "integration: Integration tests between components",
    "gpu: Tests requiring GPU hardware (deselected by default)",
    "slow: Tests with higher execution time",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

